name: Build for Blender 5.3

on:
  workflow_call:

defaults:
  run:
    shell: bash

env:
  archive-name: gatling_Blender5.3_Windows_x64
  mesa-version: 25.2.8

jobs:
  build-plugin:
    name: Build gatling

    runs-on: windows-2022

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        show-progress: false

    - name: Make dirs
      run: mkdir -p BUILD INSTALL

    - name: Check out deps
      run: |
        git clone --filter=blob:none --no-checkout --depth 1 --sparse --branch blender-v5.3-release https://projects.blender.org/blender/lib-windows_x64 DEPS
        cd DEPS
        git sparse-checkout init --cone
        git sparse-checkout add imath MaterialX opensubdiv python tbb usd vulkan
        git checkout

    - name: Apply patches
      run: |
        patch --binary DEPS/usd/pxrConfig.cmake .github/patches/blender53/pxrConfig.cmake.patch
        patch --binary DEPS/usd/cmake/pxrTargets.cmake .github/patches/blender53/pxrTargets.cmake.patch
        patch --binary DEPS/MaterialX/lib/cmake/MaterialX/MaterialXConfig.cmake .github/patches/blender53/MaterialXConfig.cmake.patch

    - name: Fetch & unpack MDL SDK binaries
      run: |
        curl "https://github.com/NVIDIA/MDL-SDK/releases/download/2026.0.0/MDL-SDK-2026.0.0-391700.996-nt-x86-64.zip" -L --progress-bar -o MDL_SDK.zip
        mkdir -p MDL-SDK
        unzip MDL_SDK.zip -d MDL-SDK
        mv MDL-SDK/*/* MDL-SDK/.

    - name: Generate build system files using CMake
      working-directory: BUILD
      run: |
        MaterialX_DIR=../DEPS/MaterialX/lib/cmake/MaterialX \
        VulkanHeaders_DIR=../DEPS/vulkan/share/cmake/VulkanHeaders \
        Imath_DIR=../DEPS/imath \
        cmake .. \
          -DCMAKE_CXX_FLAGS="-D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR" \
          -DPython3_ROOT_DIR="$PWD/../DEPS/python/313" \
          -DPython3_EXECUTABLE="$PWD/../DEPS/python/313/bin/python.exe" \
          -DPython3_LIBRARY="$PWD/../DEPS/python/313/libs/python313.lib" \
          -DPXR_CMAKE_DIR=../DEPS/usd \
          -DTBB_ROOT=../DEPS/tbb \
          -DUSD_ROOT=../DEPS/usd \
          -DMDL_ROOT=../MDL-SDK \
          -DCMAKE_INSTALL_PREFIX="$PWD/../INSTALL/render_delegate" \
          -DCMAKE_BUILD_TYPE=Release \
          -G"Visual Studio 17 2022" \
          -Ax64

    - name: Compile gatling
      working-directory: BUILD
      run: |
        cmake --build . --target hdGatling -j 2 --config Release
        cmake --install . --component hdGatling --config Release

    - name: Copy plugin files
      run: cp -r dist/blender/* INSTALL

    - name: Upload archive
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.archive-name }}
        path: INSTALL/*
        if-no-files-found: error
        retention-days: 7

  test-plugin:
    name: Test gatling in Blender
    needs: build-plugin

    runs-on: windows-2022
    timeout-minutes: 30

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        show-progress: false

    - name: Download plugin
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.archive-name }}
        path: PLUGIN

    - name: Install Blender
      run: |
        choco install vulkan-sdk -y
        choco install blender --version=5.3.0 -y --no-progress

    - name: Install OpenImageIO tools
      run: |
        python -m pip install --only-binary :all: --disable-pip-version-check --no-cache-dir OpenImageIO
        oiiotool --version

    - name: Fetch and unpack Mesa
      run: |
        curl -L --progress-bar -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${{ env.mesa-version }}/mesa3d-${{ env.mesa-version }}-release-mingw.7z"
        mkdir -p MESA
        7z x mesa.7z -oMESA -y > /dev/null

    - name: Set up Vulkan environment
      run: |
        ICD=$(find MESA -iname "lvp_icd*.json" -print -quit)
        ICD_WIN=$(cygpath -wa "$ICD")

        # The loader ignores VK_DRIVER_FILES when the process is elevated; write to registry
        MSYS_NO_PATHCONV=1 reg.exe add "HKLM\SOFTWARE\Khronos\Vulkan\Drivers" /v "$ICD_WIN" /t REG_DWORD /d 0 /f

        BLENDER=$(ls -d "/c/Program Files/Blender Foundation/Blender"*/blender.exe 2>/dev/null | head -n 1)
        echo "BLENDER=$BLENDER" >> $GITHUB_ENV

    - name: Install plugin
      run: |
        EXTENSION_DIR="$APPDATA/Blender Foundation/Blender/5.3/extensions/user_default/hydra_gatling"
        mkdir -p "$EXTENSION_DIR"
        cp -r PLUGIN/* "$EXTENSION_DIR"/

    - name: Render test scene
      run: |
        mkdir -p TEST
        cd TEST
        "$BLENDER" \
          --background \
          --factory-startup \
          --addons bl_ext.user_default.hydra_gatling \
          --python-exit-code 1 \
          --python ../.github/tests/blender53/script.py \
          2>&1 | tee blender.log

    - name: Compare images
      run: |
        idiff -fail 0.05 -failpercent 1 -v \
          -o TEST/diff.png -abs -scale 4 \
          .github/tests/blender53/ref.png TEST/test.png

    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-artifacts-${{ env.archive-name }}
        path: TEST/
        retention-days: 7
        if-no-files-found: ignore
